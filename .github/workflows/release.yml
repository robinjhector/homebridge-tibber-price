# Publishes the package to npm when a GitHub release is published.
# See RELEASING.md for the step-by-step release process.
#
# Authentication uses npm trusted publishing (OIDC), so no npm token is stored in the repo.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Check that the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$VERSION'"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs lint + build.
      # The npm dist-tag follows the version: a pre-release version (e.g. 2.2.0-beta.0) goes to "beta", anything else
      # to "latest". The release's pre-release checkbox is only used for a warning if the two disagree.
      - name: Publish to npm
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) DIST_TAG=beta ;;
            *) DIST_TAG=latest ;;
          esac
          if [ "$PRERELEASE" = "true" ] && [ "$DIST_TAG" = "latest" ]; then
            echo "::warning::The release is marked as a pre-release, but $VERSION isn't a pre-release version. Publishing as latest."
          elif [ "$PRERELEASE" != "true" ] && [ "$DIST_TAG" = "beta" ]; then
            echo "::warning::$VERSION is a pre-release version, but the release isn't marked as one. Publishing as beta."
          fi
          npm publish --tag "$DIST_TAG"
